spring.application.name=nuoctuoi
server.port=8080

# ===== Kết nối SQL Server Express (instance SQLEXPRESS, cổng 14330) =====
# Đăng nhập bằng tài khoản Windows (integratedSecurity) -> không có mật khẩu trong code
spring.datasource.url=jdbc:sqlserver://localhost:14330;databaseName=NuocTuoi;integratedSecurity=true;encrypt=true;trustServerCertificate=true
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / Hibernate =====
# Tự tạo/cập nhật bảng theo các lớp trong model
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# Lưu chuỗi dạng NVARCHAR để không lỗi tiếng Việt
spring.jpa.properties.hibernate.use_nationalized_character_data=true

# ===== Giao diện =====
spring.thymeleaf.cache=false
# Ngày hệ thống khi demo dữ liệu mẫu tháng 10 (xóa dòng này để dùng ngày thật)
nuoctuoi.ngay-he-thong=2026-10-06