<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments :: head('Duyệt phiếu ghi đè')}"></head>
<body>
<div th:replace="~{fragments :: dauTrang}"></div>
<div class="noi-dung">
    <div th:replace="~{fragments :: thongBao}"></div>
    <div class="trang">
        <h3 th:text="'Duyệt phiếu ' + ${phieu.maPhieu}"></h3>
        <table class="form">
            <tr><td>Đề xuất:</td><td th:text="${phieu.maDeXuat}"></td></tr>
            <tr><td>Người ghi đè:</td><td th:text="${phieu.nguoiGhiDe} + ' – ' + ${@dd.ngayGio(phieu.thoiDiem)}"></td></tr>
            <tr><td>Lý do:</td><td th:text="${phieu.lyDo} + ' – ' + ${phieu.moTa}"></td></tr>
            <tr><td>Lượng gốc / xin:</td><td th:text="${@dd.so(phieu.luongGoc)} + ' m³ / ' + ${@dd.so(phieu.luongMoi)} + ' m³'"></td></tr>
            <tr>
                <td>Được duyệt tối đa:</td>
                <td><b th:text="${@dd.so(luongToiDa)} + ' m³'"></b> (gốc + phần hạn mức còn lại, QĐ9)</td>
            </tr>
        </table>

        <p th:if="${vuot}">Lượng xin vượt mức tối đa → hệ thống đã chọn sẵn "Điều chỉnh" về <b th:text="${@dd.so(luongToiDa)} + ' m³'"></b>.</p>

        <form th:action="@{/phe-duyet/duyet}" method="post">
            <input type="hidden" name="ma" th:value="${phieu.maPhieu}">
            <p>
                <label><input type="radio" name="quyetDinh" value="Chấp nhận" th:checked="${!vuot}"> Chấp nhận</label>
                <label><input type="radio" name="quyetDinh" value="Điều chỉnh" id="dieuChinh" th:checked="${vuot}"> Điều chỉnh</label>
                <label><input type="radio" name="quyetDinh" value="Từ chối"> Từ chối</label>
            </p>
            <table class="form">
                <tr><td>Lượng duyệt (m³):</td><td><input name="luongDuyet" type="number" step="0.1"
                           th:value="${vuot ? luongToiDa : phieu.luongMoi}"
                           oninput="document.getElementById('dieuChinh').checked = true;">
                    <br><small>Chấp nhận = duyệt đúng lượng xin. Muốn đổi lượng thì chọn Điều chỉnh và ghi ý kiến.</small></td></tr>
                <tr><td>Ý kiến:</td><td><textarea name="yKien" rows="2" cols="50"
                           th:text="${vuot ? 'Duyệt tối đa theo phần hạn mức còn lại' : ''}"></textarea></td></tr>
                <tr>
                    <td></td>
                    <td>
                        <button type="submit">Lưu quyết định</button>
                        <a th:href="@{/phe-duyet}">Hủy</a>
                    </td>
                </tr>
            </table>
        </form>
    </div>
</div>
</body>
</html>
