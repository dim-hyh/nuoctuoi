<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments :: head('Cây trồng')}"></head>
<body>
<div th:replace="~{fragments :: dauTrang}"></div>
<div class="noi-dung">
    <div th:replace="~{fragments :: thongBao}"></div>
    <div class="trang">
        <h3>Cây trồng và giai đoạn sinh trưởng (BM2)</h3>

        <form th:action="@{/cay-trong}" method="get">
            Chọn cây:
            <select name="ma" onchange="this.form.submit()">
                <option th:each="c : ${dsCay}" th:value="${c.maCay}" th:text="${c.tenCay}"
                        th:selected="${cay != null and c.maCay == cay.maCay}"></option>
            </select>
        </form>

        <th:block th:if="${cay != null}">
            <table class="bang">
                <tr><th>STT</th><th>Giai đoạn</th><th>Số ngày</th><th>Ngưỡng dưới (%)</th><th>Ngưỡng trên (%)</th><th>Độ sâu rễ (m)</th></tr>
                <tr th:each="g : ${dsGiaiDoan}">
                    <td th:text="${g.thuTu}"></td>
                    <td th:text="${g.tenGiaiDoan}"></td>
                    <td th:text="${g.soNgay}"></td>
                    <td th:text="${@dd.so(g.nguongDuoi)}"></td>
                    <td th:text="${@dd.so(g.nguongTren)}"></td>
                    <td th:text="${@dd.so(g.doSauRe)}"></td>
                </tr>
                <tr><td colspan="2"><b>Tổng thời gian</b></td><td><b th:text="${tongNgay}"></b></td><td colspan="3"></td></tr>
            </table>

            <p><b th:text="'Thêm giai đoạn cho ' + ${cay.tenCay}"></b></p>
            <form th:action="@{/cay-trong/them-giai-doan}" method="post">
                <input type="hidden" name="maCay" th:value="${cay.maCay}">
                <table class="form">
                    <tr>
                        <td>Tên giai đoạn:</td><td><input name="tenGiaiDoan"></td>
                        <td>Số ngày:</td><td><input name="soNgay" type="number"></td>
                    </tr>
                    <tr>
                        <td>Ngưỡng ẩm dưới (%):</td><td><input name="nguongDuoi" type="number" step="0.1"></td>
                        <td>Ngưỡng ẩm trên (%):</td><td><input name="nguongTren" type="number" step="0.1"></td>
                    </tr>
                    <tr>
                        <td>Độ sâu rễ (m):</td><td><input name="doSauRe" type="number" step="0.01"></td>
                        <td></td><td><button type="submit">Thêm giai đoạn</button></td>
                    </tr>
                </table>
            </form>
        </th:block>

        <p><b>Thêm cây trồng mới</b></p>
        <form th:action="@{/cay-trong/them-cay}" method="post">
            Mã cây: <input name="maCay" style="width:80px">
            Tên cây: <input name="tenCay">
            <button type="submit">Thêm cây</button>
        </form>
    </div>
</div>
</body>
</html>
