<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments :: head('Hạn mức nước')}"></head>
<body>
<div th:replace="~{fragments :: dauTrang}"></div>
<div class="noi-dung">
    <div th:replace="~{fragments :: thongBao}"></div>
    <div class="trang">
        <h3>Cấp hạn mức nước (BM5)</h3>
        <form th:action="@{/han-muc/them}" method="post">
            <table class="form">
                <tr>
                    <td>Vùng:</td>
                    <td>
                        <select name="maVung">
                            <option th:each="v : ${dsVung}" th:value="${v.maVung}" th:text="${v.maVung} + ' – ' + ${v.tenVung}"></option>
                        </select>
                    </td>
                    <td>Từ ngày:</td><td><input name="tuNgay" type="date"></td>
                    <td>Đến ngày:</td><td><input name="denNgay" type="date"></td>
                </tr>
                <tr>
                    <td>Hạn mức (m³):</td><td><input name="hanMuc" type="number" step="0.1"></td>
                    <td colspan="4"><button type="submit">Cấp hạn mức</button></td>
                </tr>
            </table>
        </form>

        <table class="bang">
            <tr><th>Mã</th><th>Vùng</th><th>Từ ngày</th><th>Đến ngày</th><th>Hạn mức (m³)</th><th>Đã dùng + giữ chỗ</th><th>Còn lại</th><th>Trạng thái</th><th>Bổ sung nước</th></tr>
            <tr th:each="hm : ${dsHanMuc}" th:with="tt=${hm.trangThai(qd)}">
                <td th:text="${hm.maHanMuc}"></td>
                <td th:text="${hm.maVung}"></td>
                <td th:text="${@dd.ngay(hm.tuNgay)}"></td>
                <td th:text="${@dd.ngay(hm.denNgay)}"></td>
                <td th:text="${@dd.so(hm.hanMuc)}"></td>
                <td th:text="${@dd.so(hm.daDung)}"></td>
                <td th:text="${@dd.so(hm.conLai)}"></td>
                <td th:text="${tt}" th:classappend="${tt != 'Bình thường'} ? 'canhbao'"></td>
                <td>
                    <form th:action="@{/han-muc/bo-sung}" method="post" class="nut-dong"
                          onsubmit="return confirm('Bổ sung thêm nước cho kỳ hạn mức này?');">
                        <input type="hidden" name="maHanMuc" th:value="${hm.maHanMuc}">
                        <input name="luongThem" type="number" step="0.1" min="0.1" style="width:80px" placeholder="m³">
                        <button type="submit">Bổ sung</button>
                    </form>
                </td>
            </tr>
        </table>
    </div>
</div>
</body>
</html>
